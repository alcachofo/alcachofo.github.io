name: Deploy to GitHub Pages

# Every push to main rebuilds and redeploys the site; it can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what Pages needs: read the repo, write the Pages deployment, and the OIDC token Pages asks for.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push cancels a deploy still in progress, so the last push always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because each post's "Last updated" date is read from git log.
          fetch-depth: 0
      # The same Node and bun versions as the project pins, so CI builds match local ones.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Draws any missing covers, builds the static export and flattens it into out/.
      - name: Build static site
        run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
